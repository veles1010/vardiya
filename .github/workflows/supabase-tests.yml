name: Supabase tenant access tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-tests.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Supabase CLI
        id: cli
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Start isolated local PostgreSQL
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.121.0"
          test ! -e supabase/.temp/project-ref
          supabase db start
      - name: Apply migrations to empty local test database
        run: supabase db reset --local --no-seed
      - name: Run all 15 tenant access assertions
        id: tests
        run: |
          set -euo pipefail
          test -s supabase/tests/tenant_access.sql
          supabase test db --local supabase/tests/tenant_access.sql 2>&1 | tee tenant-access.log
          # Fail even if the harness exits zero after discovering no/full fewer tests.
          grep -Eq 'Files=1, Tests=15([,[:space:]]|$)' tenant-access.log
          grep -Eq '^Result: PASS[[:space:]]*$' tenant-access.log
          echo '### PostgreSQL tenant access: 15/15 assertions passed' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove disposable local database
        if: always() && steps.cli.outcome == 'success'
        run: supabase stop --no-backup
